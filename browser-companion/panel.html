<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Axiom Studia Study Panel</title>
  <link rel="stylesheet" href="panel.css">
  <script src="panel.js" defer></script>
</head>
<body>
  <header><span class="mark">A</span><div><strong>AXIOM STUDIA</strong><small>STUDY PANEL</small></div></header>
  <main>
    <p id="status" role="status">Connecting to your workspace…</p>
    <div id="workspace" hidden>
      <label for="subject">SUBJECT</label>
      <select id="subject"></select>
      <section aria-labelledby="timer-title">
        <h2 id="timer-title">Timer</h2>
        <div id="time" aria-live="off">00:00:00</div>
        <div class="actions"><button id="start" class="primary">Start</button><button id="pause">Pause</button><button id="reset">Reset</button></div>
        <small id="timer-state"></small>
      </section>
      <section aria-labelledby="tasks-title"><h2 id="tasks-title">Tasks</h2><div id="tasks"></div></section>
      <section aria-labelledby="resources-title"><h2 id="resources-title">Resources</h2><div id="resources"></div></section>
      <button id="show-axiom" class="workspace-link">Back to Axiom Workspace ↗</button>
    </div>
  </main>
</body>
</html>
